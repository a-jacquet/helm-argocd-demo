apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hello
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-hello
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
  type: {{ .Values.service.type }}
