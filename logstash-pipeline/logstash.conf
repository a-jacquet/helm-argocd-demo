input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch-local:9200"]
    index => "spring-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
